services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/fleet_management
    depends_on:
      mongo:
        condition: service_healthy
    restart: on-failure

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: