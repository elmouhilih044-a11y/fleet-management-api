      description: 'Rôle : chauffeur (driver). Le statut évolue seulement dans l''ordre todo, in_progress, completed, sans retour en arrière. Pour démarrer (in_progress), startMileage est obligatoire. Pour terminer (completed), endMileage et fuelConsumed sont obligatoires, et endMileage doit être strictement supérieur à startMileage. Quand le trajet est terminé, le kilométrage des véhicules et des pneus est mis à jour et les alertes de maintenance sont vérifiées.'
